apply plugin: 'com.android.application'

// Clé de signature release : android/keystore.properties (jamais commité — voir docs/PUBLICATION_ANDROID.md)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    // Le marqueur d'ordre des octets est retiré avant lecture : sous Windows,
    // Set-Content -Encoding UTF8 en écrit un, et Properties.load l'attache au
    // nom de la première clé, qui devient invisible pour Gradle. L'échec est
    // alors « Cannot convert 'null' to File », sans rapport apparent.
    keystoreProperties.load(new StringReader(
        keystorePropertiesFile.getText("UTF-8").replaceFirst("^\\uFEFF", "")))
}
if (keystorePropertiesFile.exists() && !keystoreProperties['storeFile']) {
    throw new GradleException(
        "android/keystore.properties existe mais ne contient pas storeFile. " +
        "Attendu : storeFile, storePassword, keyAlias, keyPassword — " +
        "voir docs/PUBLICATION_ANDROID.md §2.")
}

// Numéro de build, calculé et non tenu à la main.
//
// Play Console refuse un AAB dont le versionCode a déjà été téléversé, et le
// refus arrive après l'import, avec un message qui ne dit pas quoi faire. Le
// numéro restait figé à 1 : chaque envoi après le premier échouait, toujours
// au moment où l'on croyait avoir fini.
//
// La valeur retenue est le nombre de minutes écoulées depuis le 1er janvier
// 1970. Elle croît d'elle-même, ne redescend jamais, et vaut aujourd'hui une
// trentaine de millions — très loin du plafond de Play (2 100 000 000), qui ne
// serait atteint qu'au quarantième siècle.
//
// La minute comme unité, et non la seconde : Play impose un entier, deux
// builds lancés dans la même minute produiraient le même numéro. C'est sans
// conséquence — le second échouerait à l'import, il suffit de le relancer —
// alors que des secondes dépasseraient le plafond dès 2038.
//
// CC_VERSION_CODE permet de forcer une valeur, pour rejouer un build à
// l'identique ou reprendre une numérotation existante.
def numeroDeBuild = {
    def force = System.getenv("CC_VERSION_CODE")
    if (force) return force.toInteger()
    // intdiv et non « / » : en Groovy la division de deux entiers rend un
    // BigDecimal, que versionCode refuse.
    return System.currentTimeMillis().intdiv(60000L) as int
}()
println "──▶ versionCode = ${numeroDeBuild}"

android {
    namespace = "com.campconnect.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.campconnect.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode numeroDeBuild
        versionName "1.0.1"   // visible par les utilisateurs : se change à la main
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            // 'proguard-android-optimize.txt' : la variante non-optimize est refusée
            // par les versions récentes du plugin Android Gradle (elle bloque R8).
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
